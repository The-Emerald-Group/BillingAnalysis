services:
  billing-portal:
    image: ghcr.io/the-emerald-group/billinganalysis:latest
    container_name: billing-portal
    environment:
      - PORT=8083
      - SYNC_INTERVAL_MINUTES=1440
      # NinjaOne API credentials (Administration → Apps → API → Client App IDs)
      - NINJA_CLIENT_ID=your_ninja_client_id_here
      - NINJA_CLIENT_SECRET=your_ninja_client_secret_here
      # Regional base URL: US https://app.ninjarmm.com | EU https://eu.ninjarmm.com | OC https://oc.ninjarmm.com
      - NINJA_API_BASE=https://app.ninjarmm.com
      - NINJA_TOKEN_PATH=/ws/oauth/token
      - NINJA_DEVICES_PATH=/v2/devices-detailed
      - NINJA_OAUTH_SCOPE=monitoring
      - SOPHOS_CLIENT_ID=your_sophos_client_id_here
      - SOPHOS_CLIENT_SECRET=your_sophos_client_secret_here
      - RECENT_DEVICE_CUTOFF_DAYS=30
      - REQUEST_TIMEOUT_SECONDS=30
      - MAX_RETRIES=3
      - RETRY_DELAY_SECONDS=1.5
      - DB_PATH=/data/billing_cache.db
    ports:
      - "8083:8083"
    volumes:
      - billing_portal_data:/data
    restart: unless-stopped

volumes:
  billing_portal_data:
